version: "3.9"

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: agent-framework-demo-backend:local
    env_file:
      - ./Backend/.env
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    image: agent-framework-demo-frontend:local
    env_file:
      - ./Frontend/.env
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5001:5001"
    volumes:
      - frontend_data:/app/data
    restart: unless-stopped

volumes:
  backend_data:
  frontend_data:
